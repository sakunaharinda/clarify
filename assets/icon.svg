<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.1"/>
    </linearGradient>
    <clipPath id="lens-clip">
      <circle cx="52" cy="52" r="28"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" fill="url(#bg)"/>

  <!-- Lens fill -->
  <circle cx="52" cy="52" r="28" fill="url(#glass)"/>

  <!-- Code lines inside lens -->
  <g clip-path="url(#lens-clip)" opacity="0.9">
    <rect x="34" y="43" width="20" height="5" rx="2.5" fill="#a5b4fc"/>
    <rect x="34" y="53" width="30" height="5" rx="2.5" fill="#818cf8"/>
    <rect x="34" y="63" width="14" height="5" rx="2.5" fill="#a5b4fc"/>
  </g>

  <!-- Lens ring -->
  <circle cx="52" cy="52" r="28" fill="none" stroke="#818cf8" stroke-width="7" stroke-linejoin="round"/>

  <!-- Handle -->
  <line x1="72" y1="72" x2="94" y2="94" stroke="#818cf8" stroke-width="9" stroke-linecap="round"/>

  <!-- Sparkle (top-right) -->
  <!-- Vertical bar -->
  <line x1="98" y1="18" x2="98" y2="30" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Horizontal bar -->
  <line x1="92" y1="24" x2="104" y2="24" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Diagonal TL-BR -->
  <line x1="93" y1="19" x2="103" y2="29" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Diagonal TR-BL -->
  <line x1="103" y1="19" x2="93" y2="29" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
</svg>
